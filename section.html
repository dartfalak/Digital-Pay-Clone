<div class="container">
    <h2>Quick balance check</h2>
    
    <div class="tabs">
      <div class="tab active">Withdraw</div>
      <div class="tab">Exchange</div>
    </div>
    
    <div class="form-group">
      <select class="select-box">
        <option>€ EUR</option>
        <option>$ USD</option>
        <option>£ GBP</option>
      </select>
      
      <select class="select-box">
        <option>*5780</option>
        <option>*1234</option>
        <option>*9876</option>
      </select>
    </div>

    <input class="amount-box" type="number" placeholder="Amount" />

    <div class="limits">
      <span>min 18.00 EUR</span>
      <span>max 35,900.50 EUR</span>
    </div>

    <button class="btn">Review</button>
  </div>

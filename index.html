 <div class="grey-container">
        <div class="white-card">
            <h1 class="card-header">Quick balance check</h1>
            
            <div class="action-buttons">
                <button class="btn withdraw">Withdraw</button>
                <button class="btn exchange">Exchange</button>
            </div>
            
            <div class="balance-section">
                <span class="currency">EUR</span>
                <h2 class="balance">550.00</h2>
                <div class="limits">
                    <span class="min">min 18.00 EUR</span>
                    <span class="max">max 35,900.50 EUR</span>
                </div>
            </div>
            
            <div class="amount-section">
                <label class="amount-label">Amount</label>
                <input type="text" class="amount-input" value="15780">
            </div>
            
            <div class="review-section">
                <h3 class="review-title">Review</h3>
                
                <div class="transaction-category">Recycling</div>
                <div class="transaction-category">Travel 5 events</div>
                
                <div class="transaction-row">
                    <span class="transaction-amount">95.00</span>
                    <span class="transaction-amount">75.00</span>
                </div>

                </div>
                <div class="transaction-row">

                </div>

                    <span class="user-name">Amy Evans</span>
                    <span class="transaction-amount">935.00</span>
                </div>
                <div class="transaction-time">(2:26 PM)</div>
                
                <div class="transaction-row">

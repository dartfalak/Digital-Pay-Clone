<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payoneer Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div class="first-sec">
    <div class="logo">
      <img src="payoneer-dark-logo.svg" alt="Payoneer Logo">
      <p>Manage your money</p>
    </div>
  </div>

  
  <div class="second-sec">
    <h4>Week 4-10 July</h4>
    <p>€ 897.00</p>

    <div class="graph">
      <div class="bar" style="height: 100px;">Mon</div>
      <div class="bar" style="height: 60px;">Tue</div>
      <div class="bar" style="height: 250px;">Wed</div>
      <div class="bar" style="height: 150px;">Thu</div>
      <div class="bar" style="height: 200px;">Fri</div>
      <div class="bar" style="height: 90px;">Sat</div>
    </div>
  </div>

  
  <div class="third-sec">
    <div class="container">
      <h2>Quick balance check</h2>

      <div class="tabs">
        <div class="tab active">Withdraw</div>
        <div class="tab">Exchange</div>
      </div>

      <div class="form-group">
        <select class="select-box">
          <option>€ EUR</option>
          <option>$ USD</option>
          <option>£ GBP</option>
        </select>
        <select class="select-box">
          <option>*5780</option>
          <option>*1234</option>
          <option>*9876</option>
        </select>
      </div>

      <input class="amount-box" type="number" placeholder="Amount" />

      <div class="limits">
        <span>min 18.00 EUR</span>
        <span>max 35,900.50 EUR</span>
      </div>

      <button class="btn">Review</button>
    </div>
  </div>

  
  <div class="fourth-sec">
    <h3 style="text-align:center; padding-top:220px; color:#555;">
      Additional features coming soon…
    </h3>
  </div>

</body>
</html>

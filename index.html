    </div>

<div class="grey-container">
        <div class="balance-card">
            <div class="balance-header">Quick balance check</div>
            
            <div class="button-row">
                <button class="action-btn">Withdraw</button>
                <button class="action-btn">Exchange</button>
            </div>
            
            <div class="balance-display">
                <div class="currency">EUR</div>
                <div class="amount">550.00</div>
                <div class="limit">min 18.00 EUR</div>
                <div class="limit">max 35,900.50 EUR</div>
            </div>
            
            <div class="amount-input">
                <div class="input-label">Amount</div>
                <input type="text" class="amount-field" value="15780">
            </div>
            
            <div class="review-section">
                <div class="review-item">
                    <span class="review-amount">785.00</span>
                    <span class="review-note">75.00</span>
                </div>
                <div class="review-category">Travel 5 events</div>
                
                <div class="review-item">
                    <span class="review-amount">95.00</span>
                </div>
                <div class="review-category">Dollar 24 events</div>
                
                <div class="review-user">Amy Evans</div>
                <div class="review-item">
                    <span class="review-amount">935.00</span>
                </div>
                <div class="review-time">(2:26 PM)</div>
                
                <div class="review-item">
                    <span class="review-amount">950.00</span>
                    <span class="review-amount">520.50</span>
                </div>
                <div class="review-category">Delivery 8 events</div>
            </div>
